<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SupportHUB</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></a>
        <p>Sign in to access your role-based dashboard</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@demo.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
          <div style="text-align: right; margin-top: 0.4rem;">
            <a href="forgot-password.html" style="font-size: 0.825rem; font-weight: 600; color: #1e3a8a; text-decoration: none;">Forgot Password?</a>
          </div>
        </div>

        <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 0.75rem;">Sign In</button>
      </form>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    function autofillDemoUser(role) {
      const emailEl = document.getElementById('email');
      const passEl = document.getElementById('password');

      switch (role) {
        case 'customer':
          emailEl.value = 'customer@demo.com';
          passEl.value = 'Customer123!';
          break;
        case 'officer':
          emailEl.value = 'officer@demo.com';
          passEl.value = 'Officer123!';
          break;
        case 'supervisor':
          emailEl.value = 'supervisor@demo.com';
          passEl.value = 'Supervisor123!';
          break;
        case 'manager':
          emailEl.value = 'manager@demo.com';
          passEl.value = 'Manager123!';
          break;
        case 'qa':
          emailEl.value = 'qa@demo.com';
          passEl.value = 'QaExecutive123!';
          break;
        default:
          emailEl.value = '';
          passEl.value = '';
          break;
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/auth/login', { email, password });
        const data = res.data;
        Auth.setSession(data.token, data);
        Utils.showToast('Login successful! Redirecting...', 'success');

        const basePath = Auth.getBasePath();

        setTimeout(() => {
          switch (data.role) {
            case 'CUSTOMER':
              window.location.href = `${basePath}/customer/customer-dashboard.html`;
              break;
            case 'CUSTOMER_SERVICE_OFFICER':
              window.location.href = `${basePath}/officer/officer-dashboard.html`;
              break;
            case 'OPERATIONS_SUPERVISOR':
              window.location.href = `${basePath}/supervisor/supervisor-dashboard.html`;
              break;
            case 'CUSTOMER_SUPPORT_MANAGER':
              window.location.href = `${basePath}/manager/manager-dashboard.html`;
              break;
            case 'QA_EXECUTIVE':
              window.location.href = `${basePath}/qa/qa-dashboard.html`;
              break;
            default:
              window.location.href = `${basePath}/index.html`;
          }
        }, 600);
      } catch (err) {
        Utils.showToast(err.message || 'Login failed', 'error');
      }
    });
  </script>
</body>

</html>
