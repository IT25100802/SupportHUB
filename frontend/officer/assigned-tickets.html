<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Queue - SupportHUB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></div></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left"></div>
        <div class="header-right">
          <div class="notif-bell-container" id="notif-bell">
            <div class="bell-icon" title="Notifications"><i class="fa-solid fa-bell"></i></div>
            <span class="notif-counter" id="notif-counter" style="display: none;">0</span>
            <div class="notif-dropdown" id="notif-dropdown">
              <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600;">Notifications</div>
              <div id="notif-dropdown-list"></div>
            </div>
          </div>
          <button onclick="Auth.logout()" class="btn-logout-icon" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <div class="page-body">
        <div class="page-header-row">
          <div class="page-title-group">
            <h1>Assigned Tickets Queue</h1>
            <p>Manage and process support tickets assigned to your account with real-time status updates.</p>
          </div>
        </div>

        <!-- Tab-by-Tab Navigation Bar -->
        <div class="ticket-tabs-container" id="status-tabs-bar">
          <button class="ticket-tab-btn active" data-status="" onclick="switchTab(this, '')">
            <i class="fa-solid fa-layer-group"></i> All Tickets <span class="ticket-tab-count" id="count-all">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="OPEN" onclick="switchTab(this, 'OPEN')">
            <i class="fa-solid fa-circle-dot" style="color: #3b82f6;"></i> Open <span class="ticket-tab-count" id="count-open">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="IN_PROGRESS" onclick="switchTab(this, 'IN_PROGRESS')">
            <i class="fa-solid fa-spinner" style="color: #f59e0b;"></i> In Progress <span class="ticket-tab-count" id="count-progress">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="WAITING_FOR_CUSTOMER" onclick="switchTab(this, 'WAITING_FOR_CUSTOMER')">
            <i class="fa-solid fa-clock" style="color: #a855f7;"></i> Waiting <span class="ticket-tab-count" id="count-waiting">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="ESCALATED" onclick="switchTab(this, 'ESCALATED')">
            <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i> Escalated <span class="ticket-tab-count" id="count-escalated">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="RESOLVED" onclick="switchTab(this, 'RESOLVED')">
            <i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Resolved <span class="ticket-tab-count" id="count-resolved">0</span>
          </button>
          <button class="ticket-tab-btn" data-status="CLOSED" onclick="switchTab(this, 'CLOSED')">
            <i class="fa-solid fa-box-archive" style="color: #64748b;"></i> Closed <span class="ticket-tab-count" id="count-closed">0</span>
          </button>
        </div>

        <!-- Search Bar -->
        <div style="margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
          <div style="position: relative; flex: 1; max-width: 420px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            <input type="text" id="filter-search" class="form-control" placeholder="Search ticket #, customer, or subject..." style="padding-left: 2.5rem;" oninput="renderFilteredCards()" />
          </div>
          <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;" id="queue-counter-info">
            Showing all assigned tickets
          </div>
        </div>

        <!-- Stacked Rectangle Cards Container -->
        <div id="assigned-cards-container" class="ticket-card-stack">
          <div style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading tickets queue...</div>
        </div>

      </div>
    </div>
  </div>

  <!-- Status Update Modal -->
  <div class="modal-backdrop" id="status-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Update Ticket Status</h3>
        <button onclick="closeStatusModal()" class="close-modal">&times;</button>
      </div>
      <form id="update-status-form">
        <input type="hidden" id="modal-ticket-id" />
        <div class="form-group">
          <label class="form-label">New Status *</label>
          <select id="modal-status-select" class="form-control" required>
            <option value="IN_PROGRESS">IN_PROGRESS (Currently Handling)</option>
            <option value="WAITING_FOR_CUSTOMER">WAITING_FOR_CUSTOMER (Awaiting customer info/proof)</option>
            <option value="ESCALATED">ESCALATED (Send to Operations Supervisor)</option>
            <option value="RESOLVED">RESOLVED (Solution Provided)</option>
            <option value="CLOSED">CLOSED (Finalized)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status Note / Resolution Remarks</label>
          <textarea id="modal-status-note" class="form-control" rows="3" placeholder="Explain the resolution steps or reason for status change..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Status Update</button>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    let allAssignedTickets = [];
    let currentStatusFilter = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.getUser();
      if (user && (user.role === 'OPERATIONS_SUPERVISOR' || user.role === 'CUSTOMER_SUPPORT_MANAGER')) {
        window.location.href = '../supervisor/team-tickets.html';
        return;
      }
      if (!Auth.requireRole(['CUSTOMER_SERVICE_OFFICER'])) return;

      Auth.renderUserHeader();
      Auth.renderSidebar();
      NotificationsEngine.init();

      await fetchQueue();

      document.getElementById('update-status-form').addEventListener('submit', handleStatusSubmit);
    });

    window.addEventListener('pageshow', () => {
      fetchQueue();
    });

    async function fetchQueue() {
      try {
        const res = await API.get('/tickets/assigned?page=0&size=100').catch(() => null);
        if (res && res.data && res.data.content) {
          allAssignedTickets = res.data.content;
        } else if (res && Array.isArray(res.data)) {
          allAssignedTickets = res.data;
        } else {
          allAssignedTickets = [];
        }

        updateTabCounters();
        renderFilteredCards();
      } catch (err) {
        allAssignedTickets = [];
        updateTabCounters();
        renderFilteredCards();
      }
    }

    function updateTabCounters() {
      const counts = {
        all: allAssignedTickets.length,
        open: 0,
        progress: 0,
        waiting: 0,
        escalated: 0,
        resolved: 0,
        closed: 0
      };

      allAssignedTickets.forEach(t => {
        if (t.status === 'OPEN') counts.open++;
        else if (t.status === 'IN_PROGRESS') counts.progress++;
        else if (t.status === 'WAITING_FOR_CUSTOMER') counts.waiting++;
        else if (t.status === 'ESCALATED' || t.isEscalated) counts.escalated++;
        else if (t.status === 'RESOLVED') counts.resolved++;
        else if (t.status === 'CLOSED') counts.closed++;
      });

      document.getElementById('count-all').textContent = counts.all;
      document.getElementById('count-open').textContent = counts.open;
      document.getElementById('count-progress').textContent = counts.progress;
      document.getElementById('count-waiting').textContent = counts.waiting;
      const escEl = document.getElementById('count-escalated');
      if (escEl) escEl.textContent = counts.escalated;
      document.getElementById('count-resolved').textContent = counts.resolved;
      document.getElementById('count-closed').textContent = counts.closed;
    }

    function switchTab(btnEl, status) {
      document.querySelectorAll('.ticket-tab-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      currentStatusFilter = status;
      renderFilteredCards();
    }

    function renderFilteredCards() {
      const search = document.getElementById('filter-search').value.trim().toLowerCase();
      const container = document.getElementById('assigned-cards-container');

      let filtered = allAssignedTickets;

      if (currentStatusFilter) {
        filtered = filtered.filter(t => t.status === currentStatusFilter);
      }

      if (search) {
        filtered = filtered.filter(t => 
          t.ticketNumber.toLowerCase().includes(search) ||
          (t.customerName && t.customerName.toLowerCase().includes(search)) ||
          (t.subject && t.subject.toLowerCase().includes(search)) ||
          (t.categoryName && t.categoryName.toLowerCase().includes(search))
        );
      }

      document.getElementById('queue-counter-info').textContent = `Showing ${filtered.length} of ${allAssignedTickets.length} tickets`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3.5rem 1.5rem; background: rgba(255,255,255,0.7); border-radius: 16px; border: 1px dashed #cbd5e1;">
            <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; color: #94a3b8; margin-bottom: 0.75rem;"></i>
            <h4 style="margin: 0 0 0.25rem 0; color: #334155;">No tickets found in this tab</h4>
            <p style="margin: 0; color: #64748b; font-size: 0.875rem;">Try selecting a different status tab or clearing your search filter.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const slaBadge = t.isSlaBreached 
          ? '<span style="font-size: 0.725rem; font-weight: 700; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.25rem 0.6rem; border-radius: 8px;"><i class="fa-solid fa-triangle-exclamation"></i> SLA Breached</span>'
          : (t.slaRemainingHours != null && t.status !== 'RESOLVED' && t.status !== 'CLOSED'
              ? `<span style="font-size: 0.725rem; font-weight: 600; background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; padding: 0.25rem 0.6rem; border-radius: 8px;"><i class="fa-regular fa-clock"></i> SLA: ${t.slaRemainingHours}h left</span>`
              : '');
        const refundBadge = (t.refundStatus && t.refundStatus !== 'NONE')
          ? `<span style="font-size: 0.725rem; font-weight: 700; background: #fef3c7; color: #b45309; border: 1px solid #fde68a; padding: 0.25rem 0.6rem; border-radius: 8px;"><i class="fa-solid fa-hand-holding-dollar"></i> ${t.refundStatus}</span>`
          : '';

        return `
          <div class="ticket-rectangle-card priority-${t.priority}">
            <div class="ticket-rect-main">
              <div class="ticket-rect-top" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <span class="ticket-number-badge">${t.ticketNumber}</span>
                <span class="ticket-category-tag"><i class="fa-solid fa-layer-group" style="color: var(--navy-primary);"></i> ${t.categoryName || 'Support'}</span>
                ${t.orderNumber ? `<span style="font-size: 0.75rem; font-weight: 700; background: #e0f2fe; color: #0284c7; padding: 0.15rem 0.5rem; border-radius: 6px; border: 1px solid #bae6fd;"><i class="fa-solid fa-box"></i> ${t.orderNumber}</span>` : ''}
                ${t.trackingNumber ? `<span style="font-size: 0.75rem; font-weight: 600; background: #f1f5f9; color: #475569; padding: 0.15rem 0.5rem; border-radius: 6px;"><i class="fa-solid fa-truck-fast"></i> ${t.trackingNumber}</span>` : ''}
              </div>
              <div class="ticket-rect-title" title="${t.subject}">${t.subject}</div>
              <div class="ticket-rect-meta">
                <div class="ticket-rect-meta-item">
                  <i class="fa-solid fa-user" style="color: var(--navy-primary);"></i>
                  <strong>${t.customerName || 'Customer'}</strong>
                </div>
                <div class="ticket-rect-meta-item">
                  <i class="fa-regular fa-clock" style="color: #64748b;"></i>
                  <span>${Utils.formatDate(t.createdAt)}</span>
                </div>
              </div>
            </div>

            <div class="ticket-rect-actions" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
              ${slaBadge}
              ${refundBadge}
              ${Utils.getPriorityBadge(t.priority)}
              ${Utils.getStatusBadge(t.status)}
              <a href="../customer/ticket-details.html?id=${t.id}" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.85rem;">
                <i class="fa-solid fa-eye"></i> Details
              </a>
              <button onclick="openStatusModal(${t.id}, '${t.status}')" class="btn btn-primary btn-sm" style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.85rem;">
                <i class="fa-solid fa-pen-to-square"></i> Status
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openStatusModal(id, currentStatus) {
      document.getElementById('modal-ticket-id').value = id;
      document.getElementById('modal-status-select').value = currentStatus;
      document.getElementById('modal-status-note').value = '';
      document.getElementById('status-modal').classList.add('show');
    }

    function closeStatusModal() {
      document.getElementById('status-modal').classList.remove('show');
    }

    async function handleStatusSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('modal-ticket-id').value;
      const status = document.getElementById('modal-status-select').value;
      const note = document.getElementById('modal-status-note').value.trim();

      try {
        await API.put(`/tickets/${id}/status`, { status, note });
        Utils.showToast('Ticket status updated successfully', 'success');
        closeStatusModal();
        await fetchQueue();
      } catch (err) {
        // Local simulation fallback for testing
        const found = allAssignedTickets.find(t => String(t.id) === String(id));
        if (found) {
          found.status = status;
          if (status === 'ESCALATED') found.isEscalated = true;
          updateTabCounters();
          renderFilteredCards();
          Utils.showToast(`Ticket status updated to ${status.replace(/_/g, ' ')}`, 'success');
          closeStatusModal();
        } else {
          Utils.showToast(err.message || 'Failed to update status', 'error');
        }
      }
    }
  </script>
</body>
</html>
