<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base - SupportHUB</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></div></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left"></div>
        <div class="header-right">
          <div class="notif-bell-container" id="notif-bell">
            <div class="bell-icon" title="Notifications"><i class="fa-solid fa-bell"></i></div>
            <span class="notif-counter" id="notif-counter" style="display: none;">0</span>
            <div class="notif-dropdown" id="notif-dropdown">
              <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600;">Notifications</div>
              <div id="notif-dropdown-list"></div>
            </div>
          </div>
          <button onclick="Auth.logout()" class="btn-logout-icon" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <div class="page-body">
        <div class="page-header-row">
          <div class="page-title-group">
            <h1>Knowledge Base & Guides</h1>
            <p>Browse technical documentation, user guides, and integration tutorials.</p>
          </div>
        </div>

        <div class="panel-card" style="margin-bottom: 1.5rem;">
          <div class="form-group" style="display: flex; gap: 0.75rem; margin-bottom: 0;">
            <input type="text" id="kb-search-input" class="form-control" placeholder="Search knowledge base articles..." />
            <button id="kb-search-btn" class="btn btn-primary">Search</button>
          </div>
        </div>

        <div id="kb-articles-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chatbot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireRole(['CUSTOMER', 'CUSTOMER_SERVICE_OFFICER', 'OPERATIONS_SUPERVISOR', 'CUSTOMER_SUPPORT_MANAGER', 'QA_EXECUTIVE'])) return;

      Auth.renderUserHeader();
      Auth.renderSidebar();
      NotificationsEngine.init();
      ChatbotWidget.init();

      await fetchArticles();

      document.getElementById('kb-search-btn').addEventListener('click', fetchArticles);
    });

    async function fetchArticles() {
      const q = document.getElementById('kb-search-input').value.trim();
      const grid = document.getElementById('kb-articles-grid');

      try {
        const endpoint = q ? `/knowledge-base/public/search?q=${encodeURIComponent(q)}` : '/knowledge-base/public';
        const res = await API.get(endpoint);
        const articles = res.data || [];

        if (articles.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-muted);">No articles found matching your query.</p>';
          return;
        }

        grid.innerHTML = articles.map(a => `
          <div class="panel-card" style="margin-bottom: 0;">
            <div style="font-size:0.75rem; color:var(--primary); font-weight:600; text-transform:uppercase; margin-bottom:0.25rem;">${a.categoryName || 'General'}</div>
            <h3 style="margin-bottom:0.75rem;">${a.title}</h3>
            <p style="color:var(--text-muted); font-size:0.875rem; margin-bottom:1rem; max-height:100px; overflow:hidden;">${a.content}</p>
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:var(--text-dim);">
              <span>Views: ${a.viewCount}</span>
              <span>${Utils.formatDate(a.createdAt)}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        Utils.showToast('Failed to load knowledge base articles', 'error');
      }
    }
  </script>
</body>
</html>
