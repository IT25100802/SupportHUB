<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequently Asked Questions - SupportHUB</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></div></div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left"></div>
        <div class="header-right">
          <div class="notif-bell-container" id="notif-bell">
            <div class="bell-icon" title="Notifications"><i class="fa-solid fa-bell"></i></div>
            <span class="notif-counter" id="notif-counter" style="display: none;">0</span>
            <div class="notif-dropdown" id="notif-dropdown">
              <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color); font-weight: 600;">Notifications</div>
              <div id="notif-dropdown-list"></div>
            </div>
          </div>
          <button onclick="Auth.logout()" class="btn-logout-icon" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </header>

      <div class="page-body">
        <div class="page-header-row">
          <div class="page-title-group">
            <h1>Frequently Asked Questions</h1>
            <p>Find immediate answers to common support inquiries.</p>
          </div>
        </div>

        <div class="panel-card" style="margin-bottom: 1.5rem;">
          <div class="form-group" style="display: flex; gap: 0.75rem; margin-bottom: 0;">
            <input type="text" id="faq-search-input" class="form-control" placeholder="Search FAQs by question or keyword..." />
            <button id="faq-search-btn" class="btn btn-primary">Search</button>
          </div>
        </div>

        <div id="faq-list-container" style="display: flex; flex-direction: column; gap: 1rem;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/chatbot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireRole(['CUSTOMER', 'CUSTOMER_SERVICE_OFFICER', 'OPERATIONS_SUPERVISOR', 'CUSTOMER_SUPPORT_MANAGER', 'QA_EXECUTIVE'])) return;

      Auth.renderUserHeader();
      Auth.renderSidebar();
      NotificationsEngine.init();
      ChatbotWidget.init();

      await fetchFaqs();

      document.getElementById('faq-search-btn').addEventListener('click', fetchFaqs);
    });

    async function fetchFaqs() {
      const q = document.getElementById('faq-search-input').value.trim();
      const container = document.getElementById('faq-list-container');

      try {
        const endpoint = q ? `/faqs/public/search?q=${encodeURIComponent(q)}` : '/faqs/public';
        const res = await API.get(endpoint);
        const faqs = res.data || [];

        if (faqs.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No FAQs found matching your query.</p>';
          return;
        }

        container.innerHTML = faqs.map(f => `
          <div class="panel-card" style="margin-bottom:0;">
            <div style="font-size:0.75rem; color:var(--primary); font-weight:600; text-transform:uppercase; margin-bottom:0.25rem;">${f.categoryName || 'General Support'}</div>
            <h3 style="color:var(--text-main); margin-bottom:0.5rem;">Q: ${f.question}</h3>
            <p style="color:var(--text-muted); font-size:0.95rem;">${f.answer}</p>
          </div>
        `).join('');
      } catch (err) {
        Utils.showToast('Failed to load FAQs', 'error');
      }
    }
  </script>
</body>
</html>
