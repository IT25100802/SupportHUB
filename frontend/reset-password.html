<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SupportHUB</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></a>
        <p>Set a new password for your account</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">Reset Token *</label>
          <input type="text" id="reset-token" class="form-control" placeholder="Paste reset token..." required />
        </div>
        <div class="form-group">
          <label class="form-label">New Password *</label>
          <input type="password" id="reset-pass" class="form-control" placeholder="Minimum 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="login.html">&larr; Return to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (token) {
        document.getElementById('reset-token').value = token;
      }

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tokenVal = document.getElementById('reset-token').value.trim();
        const newPassword = document.getElementById('reset-pass').value;

        try {
          await Auth.resetPassword(tokenVal, newPassword);
          Utils.showToast('Password reset successfully! Redirecting to login...', 'success');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (err) {
          Utils.showToast(err.message || 'Password reset failed', 'error');
        }
      });
    });
  </script>
</body>
</html>
