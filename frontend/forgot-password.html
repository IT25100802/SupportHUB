<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - SupportHUB</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo"><span class="logo-support">Support</span><span class="logo-hub">HUB</span></a>
        <p>Enter registered email to receive a password reset token</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required />
        </div>
        <button type="submit" class="btn btn-accent" style="width: 100%;">Generate Reset Token</button>
      </form>

      <div id="reset-result-box"
        style="display: none; margin-top: 1.5rem; padding: 1rem; background-color: var(--success-light); border-radius: var(--radius-sm); font-size: 0.875rem; color: #047857;">
        <strong>Reset Token Generated!</strong>
        <p style="margin-top: 0.25rem; font-family: monospace; font-size: 0.9rem;" id="token-display"></p>
        <a id="proceed-reset-link" href="#" class="btn btn-secondary btn-sm"
          style="margin-top: 0.75rem; display: inline-block;">Proceed to Password Reset</a>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="login.html">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();

        try {
          const token = await Auth.forgotPassword(email);
          document.getElementById('token-display').textContent = token;
          document.getElementById('proceed-reset-link').href = `reset-password.html?token=${encodeURIComponent(token)}`;
          document.getElementById('reset-result-box').style.display = 'block';
          Utils.showToast('Reset token generated successfully!', 'success');
        } catch (err) {
          Utils.showToast(err.message || 'Request failed', 'error');
        }
      });
    });
  </script>
</body>

</html>
